<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181f"/>
      <stop offset="100%" stop-color="#09090c"/>
    </linearGradient>
    <linearGradient id="photoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2c36"/>
      <stop offset="100%" stop-color="#16161d"/>
    </linearGradient>
    <linearGradient id="stravaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7536"/>
      <stop offset="100%" stop-color="#fc4c02"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fc4c02"/>
      <stop offset="100%" stop-color="#df3a00"/>
    </linearGradient>
  </defs>

  <!-- Full bleed background for maskable icon support -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Content Group within the 80% Safe Zone (Radius 204px around 256,256) -->
  <g transform="translate(0, 0)">
    <!-- Photo Card Background -->
    <rect x="80" y="80" width="352" height="352" rx="44" fill="url(#photoGrad)" stroke="#3f3f4e" stroke-width="6"/>

    <!-- Mountain Landscape silhouette in base photo -->
    <path d="M84 380 L180 260 L248 335 L330 230 L428 355 L428 388 C428 412 410 428 386 428 L126 428 C102 428 84 412 84 388 Z" fill="#20202a"/>
    <path d="M140 380 L215 285 L270 345 L355 245 L428 335 L428 388 C428 412 410 428 386 428 L126 428 C102 428 84 412 84 388 Z" fill="#2d2d3c" opacity="0.7"/>

    <!-- Sun in photo -->
    <circle cx="345" cy="165" r="26" fill="#fc4c02" opacity="0.3"/>

    <!-- Glowing Strava Elevation / GPS Route Trajectory -->
    <path d="M104 310 Q 185 190 260 265 T 408 175" fill="none" stroke="#000000" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
    <path d="M104 310 Q 185 190 260 265 T 408 175" fill="none" stroke="url(#stravaGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dynamic Overlay Stats Pill Badge -->
    <!-- Shadow under badge -->
    <rect x="180" y="306" width="224" height="96" rx="28" fill="#000000" opacity="0.45"/>
    <rect x="176" y="300" width="224" height="96" rx="28" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="4"/>

    <!-- Telemetry Stats Detail Lines & Icon -->
    <!-- Pulse/Activity Ring -->
    <circle cx="218" cy="348" r="18" fill="#ffffff"/>
    <polygon points="214,340 226,348 214,356" fill="#fc4c02"/>

    <!-- Stat value bars -->
    <rect x="250" y="332" width="124" height="13" rx="6.5" fill="#ffffff"/>
    <rect x="250" y="353" width="82" height="10" rx="5" fill="#ffffff" opacity="0.85"/>
  </g>
</svg>