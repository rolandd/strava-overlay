<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="stravaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b2b"/>
      <stop offset="100%" stop-color="#fc4c02"/>
    </linearGradient>
    <linearGradient id="photoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Photo frame representation -->
  <g filter="url(#shadow)">
    <rect x="72" y="72" width="368" height="368" rx="36" fill="url(#photoGrad)" stroke="#3f3f46" stroke-width="6"/>
    <!-- Mountain landscape in photo -->
    <path d="M76 360 L180 240 L260 320 L340 210 L436 340 L436 404 C436 424 420 436 400 436 L112 436 C92 436 76 424 76 404 Z" fill="#27272a"/>
    <path d="M140 360 L220 270 L280 340 L370 230 L436 320 L436 404 C436 424 420 436 400 436 L112 436 C92 436 76 424 76 404 Z" fill="#3f3f46" opacity="0.6"/>
  </g>

  <!-- Dynamic Strava GPS / Overlay Badge Layer -->
  <g filter="url(#shadow)">
    <!-- Elevation / Route Path Accent -->
    <path d="M100 290 Q 180 180 260 260 T 420 160" fill="none" stroke="url(#stravaGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Overlay stat pill badge -->
    <rect x="190" y="300" width="220" height="96" rx="24" fill="#fc4c02" stroke="#ffffff" stroke-width="4"/>
    
    <!-- Stat icons / lines inside badge -->
    <circle cx="230" cy="348" r="16" fill="#ffffff"/>
    <rect x="260" y="332" width="120" height="12" rx="6" fill="#ffffff"/>
    <rect x="260" y="352" width="80" height="10" rx="5" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>